name: DealRadar scan

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dealradar-production
  cancel-in-progress: false

jobs:
  scan:
    if: vars.DEALRADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dealradar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dealradar-state-

      - name: Refuse accidental state reset
        if: steps.state.outputs.cache-matched-key == '' && vars.DEALRADAR_ALLOW_EMPTY_STATE != 'true'
        run: exit 1

      - name: Validate and Scan
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          dealradar --config config.production.toml validate
          dealradar --config config.production.toml run

      - name: Save state even after partial failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: dealradar-state-${{ github.run_id }}-${{ github.run_attempt }}
