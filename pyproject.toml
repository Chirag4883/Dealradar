[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealradar"
version = "1.0.0"
description = "Fail-closed deal monitoring with isolated API providers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dealradar = "dealradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
