state = "state/dealradar.sqlite3"
channels = ["telegram"]

[policy]
blocked_domains = [
  "culturecircle.com",
  "culture-circle.com",
  "hypefly.co.in",
  "instagram.com",
  "dhgate.com",
  "aliexpress.com"
]
blocked_sellers = ["unverified seller", "unknown seller"]

